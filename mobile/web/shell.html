<!doctype html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SculptureABC">
<title>SculptureABC</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #292b30; color: #ddd; font-family: system-ui, sans-serif;
    /* Stop the browser's own gestures, text selection and long-press menus over the app. */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  /* 100dvh: the height that shows now. On iPad, 100vh is the height with the browser's toolbar hidden, so with the
     address bar showing the bottom of the canvas (the brush bar) sat below the screen. */
  #canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 18px; pointer-events: none; white-space: pre-wrap; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status">SculptureABC 載入中…</div>
<script>
  const statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    setStatus: (text) => { statusEl.textContent = text ? 'SculptureABC\n' + text : ''; },
    onRuntimeInitialized: () => { statusEl.textContent = ''; },
    onAbort: (what) => { statusEl.textContent = '發生錯誤，程式已停止：\n' + what; },
  };
  window.addEventListener('error', (e) => { statusEl.textContent = '錯誤：' + e.message; });
</script>
{{{ SCRIPT }}}
</body>
</html>
